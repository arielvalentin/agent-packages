name: code-reviewers-behavioral
defaults:
  executor: copilot-sdk
  runs: 1
  timeout: 60s
scoring:
  threshold: 1
stimuli:
  - name: code-reviewers-case-001-row-01
    tags:
      suite: smoke
      source_case: '1'
      source_row: '1'
    agent_environment:
      files:
        - src: ../.apm/skills/datadog-url-router/SKILL.md
          dest: .github/copilot-instructions.md
    prompt: >-
      Before a pup fallback accesses account data, must you check pup auth status? Answer one word:
      Yes or No.
    graders:
      - type: output-matches
        name: code-reviewers-case-001-row-01-a1-exact-yes
        config:
          pattern: ^\s*[*_\x60]*[yY][*_\x60]*[eE][*_\x60]*[sS][*_\x60]*[.!]?[*_\x60]*\s*$
    simulation:
      tool_overrides:
        bash:
          output: Shell execution is disabled in this text-only evaluation.
          is_error: true
  - name: code-reviewers-case-002-row-01
    tags:
      suite: smoke
      source_case: '2'
      source_row: '1'
    agent_environment:
      files:
        - src: ../.apm/skills/datadog-url-router/SKILL.md
          dest: .github/copilot-instructions.md
    prompt: >-
      Neither a direct MCP tool nor an SDK route supports this Datadog app URL. May you scrape it?
      Answer one word: Yes or No.
    graders:
      - type: output-matches
        name: code-reviewers-case-002-row-01-a1-exact-no
        config:
          pattern: ^\s*[*_\x60]*[nN][*_\x60]*[oO][*_\x60]*[.!]?[*_\x60]*\s*$
