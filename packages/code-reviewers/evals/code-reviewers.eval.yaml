    prompt: >-
      You have been invoked directly by the user, not delegated, to review supplied code. No handoff
      artifact is attached. Must you ask the user to provide an implementation-summary artifact
      before beginning? Answer exactly one word: Yes or No.
    graders:
      - type: source-output-pattern
        name: code-reviewers-case-011-row-01-a1-source-output-pattern
        scope: parent
        config:
          pattern: (?i)^no[.!]?$
          trim: true
          removeCharacters:
