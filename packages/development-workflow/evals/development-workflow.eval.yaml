      source_case: '1'
      source_row: '1'
      coverage: root-policy-behavior
    agent_environment:
      files:
        - src: fixtures/context-18edda296c35b67e.md
          dest: .github/copilot-instructions.md
    prompt: >-
      You are the main agent, development-workflow is installed, and implementer delegation is
      available and permitted. The user asks to fix a parser error. No approved design or bug report
      exists. Which agent implements by default? Return only IMPLEMENTER or MAIN.
    graders:
      - type: source-output-pattern
        name: dev-workflow-case-001-row-01-a1-source-output-pattern
        scope: parent
        config:
          pattern: (?i)^IMPLEMENTER[.!]?$
          trim: true
    simulation:
      tool_overrides:
        bash:
          output: Shell execution is disabled in this text-only evaluation.
          is_error: true
