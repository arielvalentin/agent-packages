description: "Development workflow package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n{{companion_content | default('')}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  - description: "implementer: standalone oversized tasks return to the user"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "You are invoked directly by the user, no calling agent exists, and the task bundles unrelated concerns. Who do you ask to decompose it? Reply exactly User."
    assert:
      - type: icontains
        value: "user"

  - description: "system-architect: standalone requirements do not need delegation"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "You were invoked directly with complete user requirements and no prior artifacts. Must a coordinator agent assign a handoff first? Reply exactly No."
    assert:
      - type: icontains
        value: "no"

  # --- implementer agent ---
  - description: "implementer: generates a repository-required title"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      companion_content: file://../../agent-defaults/.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Repository instructions require the exact PR title 'PROJ-123 Fix login crash', not a Conventional Commits prefix. I authorize creating this draft PR; all required safety and review gates have passed and no PR exists. Return only a gh pr create command with --draft, --title, and --body."
    assert:
      - type: icontains
        value: "gh pr create"
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "/(?:^|\\s)--title(?:=|\\s+)([\\u0022\\u0027])PROJ-123 Fix login crash\\1(?:\\s|$)/.test(output)"

  - description: "implementer: repository title format takes precedence"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "Which PR title format takes precedence: the repository's required format or the generic Conventional Commits default? Answer one word: repository or default."
    assert:
      - type: javascript
        value: "/^repository[.!]?$/i.test(output.trim().replace(/[*_]/g, '').split(String.fromCharCode(96)).join(''))"

  - description: "implementer: reads handoff-envelope inputs"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you receive your task assignment?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('handoff') || l.includes('envelope') || l.includes('goal') || l.includes('artifact') || l.includes('assignment') || l.includes('task') || l.includes('input') || l.includes('instruction')"

  - description: "implementer: opens the early draft PR create command non-interactively with a conventional --title plus a --body in position (no prose fallback, no <type> placeholder exception, no WIP)"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      companion_content: file://../../agent-defaults/.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I authorize creating this draft PR and all required safety and review gates have passed. The repository has no title override. I am fixing a null-pointer crash in the login handler on this production branch, and no draft PR exists yet. Respond with only the exact shell command to run right now: a `gh pr create --draft` command with a `--title` and a `--body`."
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "gh pr create"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "const raw = output; const BT = String.fromCharCode(96); const DQ = String.fromCharCode(34); const SQ = String.fromCharCode(39); const SENT = String.fromCharCode(1); const normalized = raw.replace(/\\\\\\s*\\n\\s*/g, ' '); function ciIndexOf(text, needle, from) { const escaped = needle.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&').replace(/\\s+/g, '\\\\s+'); const re = new RegExp(escaped, 'i'); const rel = text.slice(from || 0).search(re); return rel === -1 ? -1 : rel + (from || 0); } function maskFlag(text, flag) { return text.replace(new RegExp('(--' + flag + '\\\\s*=?\\\\s*)' + BT + '([^' + BT + ']*)' + BT, 'gi'), function (m, p1, p2) { return p1 + SENT + p2 + SENT; }); } const masked = maskFlag(maskFlag(normalized, 'title'), 'body'); function extractCreateSegments(text) { const out = []; const anchor = 'gh pr create'; const ghRe = /\\bgh\\b/gi; let idx = ciIndexOf(text, anchor); while (idx !== -1) { const searchFrom = idx + anchor.length; const nextCreate = ciIndexOf(text, anchor, searchFrom); const nextBacktick = text.indexOf(BT, searchFrom); const nextNewline = text.indexOf('\\n', searchFrom); ghRe.lastIndex = searchFrom; const ghMatch = ghRe.exec(text); const nextGh = ghMatch ? ghMatch.index : -1; const stops = [nextCreate, nextBacktick, nextNewline, nextGh].filter((i) => i !== -1); const end = stops.length ? Math.min(...stops) : text.length; out.push(text.slice(idx, end)); idx = nextCreate; } return out; } const createSegments = extractCreateSegments(masked).map((seg) => seg.split(/\\s*(?:&&|;|\\|\\|)\\s*/)[0]); function extractArg(segment, flag) { const anchorRe = new RegExp('--' + flag + '\\\\s*=?\\\\s*', 'i'); const m = anchorRe.exec(segment); if (!m) return null; const rest = segment.slice(m.index + m[0].length); let val = ''; if (rest[0] === DQ) { const end = rest.indexOf(DQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SQ) { const end = rest.indexOf(SQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SENT) { const end = rest.indexOf(SENT, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else { const flagMatch = rest.match(/\\s+--[a-z]/i); const flagIdx = flagMatch ? flagMatch.index : -1; const nlIdx = rest.indexOf('\\n'); const stops = [flagIdx, nlIdx].filter((i) => i !== -1); const endIdx = stops.length ? Math.min(...stops) : rest.length; val = rest.slice(0, endIdx); } return val.trim(); } const conventionalRe = /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/; const wipRe = /^wip\\b/i; const draftCreateSegments = createSegments.filter((segment) => /--draft\\b/i.test(segment)); const hasDraftCreate = draftCreateSegments.length > 0; const allDraftCreatesValid = hasDraftCreate && draftCreateSegments.every((segment) => { const title = extractArg(segment, 'title'); const body = extractArg(segment, 'body'); return title !== null && title !== '' && conventionalRe.test(title) && !wipRe.test(title) && body !== null && body !== ''; }); hasDraftCreate && allDraftCreatesValid"

  - description: "implementer: follows TDD approach"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you approach writing code for a new feature?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('test') || l.includes('tdd') || l.includes('spec') || l.includes('verify') || l.includes('clarif') || l.includes('design') || l.includes('artifact') || l.includes('implement') || l.includes('code') || l.includes('feature')"

  - description: "implementer: matches surrounding code style"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you decide on code style when implementing?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('convention') || l.includes('existing') || l.includes('codebase') || l.includes('match') || l.includes('idiomatic') || l.includes('surrounding') || l.includes('consistent') || l.includes('style') || l.includes('pattern') || l.includes('follow')"

  # --- system-architect agent ---
  - description: "system-architect: writes a requested downstream design artifact"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "I request a design document at 01-design.md for a downstream implementation step. Is the requested design artifact appropriate? Reply only Yes or No."
    assert:
      - type: icontains
        value: "yes"

  - description: "system-architect: answers a small question inline"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "Small question, no implementation or file requested: why keep an API client behind one module? Answer in one sentence."
    assert:
      - type: javascript
        value: &inline-advice "output.trim().length > 15 && !/01-design|ready-for-review|artifacts_dir|\\b(?:path|file|verdict)\\b[\\u0022\\u0027]?\\s*[:=]|(?:^|[\\s\\u0022\\u0027\\u0060(])(?:[\\\\/]|~[\\\\/]|\\.{1,2}[\\\\/]|[a-z]:[\\\\/])\\S+|\\b(?:I|we)(?:\\u0027(?:ll|ve)|\\s+(?:will|have|can|shall|would|could|already|just|am|are|be|been|going|to))*\\s+(?:writ(?:e|es|ing|ten)|wrote|creat\\w*|sav\\w*|generat\\w*|produc\\w*|draft\\w*|prepar\\w*|compos\\w*)\\b[^.!?\\n]{0,80}\\b(?:(?:artifact|file|document)s?|it)\\b|\\b(?:(?:artifact|file|document)s?|it)\\s+(?:will\\s+be|has\\s+been|have\\s+been|was|were)\\s+(?:written|creat\\w*|sav\\w*|generat\\w*|produc\\w*|draft\\w*|prepar\\w*|compos\\w*)\\b|\\b(?:here|below)(?:\\s+is|\\u0027s)\\s+(?:(?:the|a|your|requested|generated|design|complete)\\s+)*(?:document|artifact|file)s?\\b|approv|follow.up|handoff|delegat/i.test(output)"
      - type: javascript
        value: "output.trim().length < 500 && /client|module|coupling|encapsulat|interface|boundary/i.test(output)"

  - description: "system-architect: optional for routine implementation"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "For routine implementation, is this architecture specialist optional or mandatory? Reply one word."
    assert:
      - type: javascript
        value: "/^optional[.!]?$/i.test(output.trim().replace(/[*_]/g, ''))"

  - description: "system-architect: preserves consequential failure and rollout analysis"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "A concise consequential design changes a production database. Must it still address realistic failure modes and rollout, migration and recovery risks? Reply only Yes or No."
    assert:
      - type: javascript
        value: "/^yes[.!]?$/i.test(output.trim().replace(/[*_]/g, ''))"

  - description: "system-architect: stops for a genuinely missing constraint"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "Choose an irreversible retention design, but the required legal retention period is unknown. It changes which design is valid. Should you guess or ask? Reply only Guess or Ask."
    assert:
      - type: javascript
        value: "/^ask[.!]?$/i.test(output.trim().replace(/[*_]/g, ''))"

  - description: "system-architect: answers document-format questions inline"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "What format should the design document use?"
    assert:
      - type: javascript
        value: *inline-advice
      - type: javascript
        value: "/table|bullet|diagram|scannable|dense|concise|markdown|section|heading/i.test(output)"
