description: "Development workflow package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  # --- implementer agent ---
  - description: "implementer: reads handoff-envelope inputs"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you receive your task assignment?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('handoff') || l.includes('envelope') || l.includes('goal') || l.includes('artifact') || l.includes('assignment') || l.includes('task') || l.includes('input') || l.includes('instruction')"

  - description: "implementer: opens the early draft PR create command with a conventional --title in position (no prose fallback, no <type> placeholder exception, no WIP)"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "I am fixing a null-pointer crash in the login handler on this production branch, and no draft PR exists yet. Respond with only the exact shell command to run right now: a `gh pr create --draft` command with a `--title` and a `--body`."
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "gh pr create"
      - type: javascript
        value: "const raw = output; const BT = String.fromCharCode(96); const DQ = String.fromCharCode(34); const SQ = String.fromCharCode(39); const SENT = String.fromCharCode(1); const normalized = raw.replace(/\\\\\\s*\\n\\s*/g, ' '); function ciIndexOf(text, needle, from) { const escaped = needle.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&').replace(/\\s+/g, '\\\\s+'); const re = new RegExp(escaped, 'i'); const rel = text.slice(from || 0).search(re); return rel === -1 ? -1 : rel + (from || 0); } const masked = normalized.replace(new RegExp('(--title\\\\s*=?\\\\s*)' + BT + '([^' + BT + ']*)' + BT, 'gi'), function (m, p1, p2) { return p1 + SENT + p2 + SENT; }); function extractCreateSegments(text) { const out = []; const anchor = 'gh pr create'; const ghRe = /\\bgh\\b/gi; let idx = ciIndexOf(text, anchor); while (idx !== -1) { const searchFrom = idx + anchor.length; const nextCreate = ciIndexOf(text, anchor, searchFrom); const nextBacktick = text.indexOf(BT, searchFrom); const nextNewline = text.indexOf('\\n', searchFrom); ghRe.lastIndex = searchFrom; const ghMatch = ghRe.exec(text); const nextGh = ghMatch ? ghMatch.index : -1; const stops = [nextCreate, nextBacktick, nextNewline, nextGh].filter((i) => i !== -1); const end = stops.length ? Math.min(...stops) : text.length; out.push(text.slice(idx, end)); idx = nextCreate; } return out; } const createSegments = extractCreateSegments(masked).map((seg) => seg.split(/\\s*(?:&&|;|\\|\\|)\\s*/)[0]); function extractTitleArg(segment) { const anchorRe = /--title\\s*=?\\s*/i; const m = anchorRe.exec(segment); if (!m) return null; const rest = segment.slice(m.index + m[0].length); let title = ''; if (rest[0] === DQ) { const end = rest.indexOf(DQ, 1); title = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SQ) { const end = rest.indexOf(SQ, 1); title = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SENT) { const end = rest.indexOf(SENT, 1); title = end === -1 ? rest.slice(1) : rest.slice(1, end); } else { const flagMatch = rest.match(/\\s+--[a-z]/i); const flagIdx = flagMatch ? flagMatch.index : -1; const nlIdx = rest.indexOf('\\n'); const stops = [flagIdx, nlIdx].filter((i) => i !== -1); const endIdx = stops.length ? Math.min(...stops) : rest.length; title = rest.slice(0, endIdx); } return title.trim(); } const conventionalRe = /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/; const wipRe = /^wip\\b/i; const draftCreateSegments = createSegments.filter((segment) => /--draft\\b/i.test(segment)); const hasDraftCreate = draftCreateSegments.length > 0; const draftCreateTitles = draftCreateSegments.map(extractTitleArg); const allDraftCreatesHaveValidTitle = hasDraftCreate && draftCreateTitles.every((t) => t !== null && t !== '' && conventionalRe.test(t) && !wipRe.test(t)); hasDraftCreate && allDraftCreatesHaveValidTitle"

  - description: "implementer: follows TDD approach"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you approach writing code for a new feature?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('test') || l.includes('tdd') || l.includes('spec') || l.includes('verify') || l.includes('clarif') || l.includes('design') || l.includes('artifact') || l.includes('implement') || l.includes('code') || l.includes('feature')"

  - description: "implementer: matches surrounding code style"
    vars:
      skill_content: file://../.apm/agents/implementer.agent.md
      user_input: "How do you decide on code style when implementing?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('convention') || l.includes('existing') || l.includes('codebase') || l.includes('match') || l.includes('idiomatic') || l.includes('surrounding') || l.includes('consistent') || l.includes('style') || l.includes('pattern') || l.includes('follow')"

  # --- system-architect agent ---
  - description: "system-architect: produces a design document"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "What is your primary output?"
    assert:
      - type: icontains
        value: "design"

  - description: "system-architect: uses dense scannable format"
    vars:
      skill_content: file://../.apm/agents/system-architect.agent.md
      user_input: "What format should the design document use?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('table') || l.includes('bullet') || l.includes('diagram') || l.includes('scannable') || l.includes('dense') || l.includes('concise') || l.includes('markdown') || l.includes('section') || l.includes('heading')"
