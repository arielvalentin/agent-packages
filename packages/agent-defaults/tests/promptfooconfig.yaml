      shard: 2
      suite: smoke
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: 'The pr-lifecycle skill is unavailable. I authorized a draft PR for this published bugfix branch in octo/example; repository guidance has no different workflow. No PR exists. Return exactly one plain shell command with this argument order: gh pr create --repo octo/example --draft --title "TITLE" --body "BODY". Replace TITLE with a concrete Conventional title of at most 72 characters and BODY with a nonempty body. No prose, Markdown fences, outer quotes, escaped quotes, extra flags, or additional commands. This is a command-format exercise, not a public post.'
