      - type: icontains
        value: "--draft"
      - type: icontains
        value: "--title"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "/^gh pr create --repo octo\\/example --draft --title \\u0022[^\\u0022\\r\\n]+\\u0022 --body \\u0022[^\\u0022\\r\\n]+\\u0022$/.test(output.trim()) && output.trim().split(String.fromCharCode(34))[1].length <= 72 && /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/.test(output.trim().split(String.fromCharCode(34))[1]) && output.trim().split(String.fromCharCode(34))[3].trim().length > 0 && !['$', '\\\\', String.fromCharCode(96)].some(value => output.includes(value))"

