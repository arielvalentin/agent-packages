  # --- pr-lifecycle ---
  - description: "pr-lifecycle: draft PR create command is non-interactive — a conventional --title plus a --body in position (no prose fallback, no <type> placeholder exception), and a later gh pr edit --title/--body cannot launder a WIP/missing create title"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I am fixing a null-pointer crash in the login handler on this bugfix branch, issue #123 tracks it, and no draft PR exists. Reply with exactly one concrete `gh pr create` shell command: no prose, no code fence, no placeholder/template command."
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "gh pr create"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "const raw = output; const BT = String.fromCharCode(96); const DQ = String.fromCharCode(34); const SQ = String.fromCharCode(39); const SENT = String.fromCharCode(1); const normalized = raw.replace(/\\\\\\s*\\n\\s*/g, ' '); function ciIndexOf(text, needle, from) { const escaped = needle.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&').replace(/\\s+/g, '\\\\s+'); const re = new RegExp(escaped, 'i'); const rel = text.slice(from || 0).search(re); return rel === -1 ? -1 : rel + (from || 0); } function maskFlag(text, flag) { return text.replace(new RegExp('(--' + flag + '\\\\s*=?\\\\s*)' + BT + '([^' + BT + ']*)' + BT, 'gi'), function (m, p1, p2) { return p1 + SENT + p2 + SENT; }); } const masked = maskFlag(maskFlag(normalized, 'title'), 'body'); function extractCreateSegments(text) { const out = []; const anchor = 'gh pr create'; const ghRe = /\\bgh\\b/gi; let idx = ciIndexOf(text, anchor); while (idx !== -1) { const searchFrom = idx + anchor.length; const nextCreate = ciIndexOf(text, anchor, searchFrom); const nextBacktick = text.indexOf(BT, searchFrom); const nextNewline = text.indexOf('\\n', searchFrom); ghRe.lastIndex = searchFrom; const ghMatch = ghRe.exec(text); const nextGh = ghMatch ? ghMatch.index : -1; const stops = [nextCreate, nextBacktick, nextNewline, nextGh].filter((i) => i !== -1); const end = stops.length ? Math.min(...stops) : text.length; out.push(text.slice(idx, end)); idx = nextCreate; } return out; } const createSegments = extractCreateSegments(masked).map((seg) => seg.split(/\\s*(?:&&|;|\\|\\|)\\s*/)[0]); function extractArg(segment, flag) { const anchorRe = new RegExp('--' + flag + '\\\\s*=?\\\\s*', 'i'); const m = anchorRe.exec(segment); if (!m) return null; const rest = segment.slice(m.index + m[0].length); let val = ''; if (rest[0] === DQ) { const end = rest.indexOf(DQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SQ) { const end = rest.indexOf(SQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SENT) { const end = rest.indexOf(SENT, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else { const flagMatch = rest.match(/\\s+--[a-z]/i); const flagIdx = flagMatch ? flagMatch.index : -1; const nlIdx = rest.indexOf('\\n'); const stops = [flagIdx, nlIdx].filter((i) => i !== -1); const endIdx = stops.length ? Math.min(...stops) : rest.length; val = rest.slice(0, endIdx); } return val.trim(); } const conventionalRe = /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/; const wipRe = /^wip\\b/i; const draftCreateSegments = createSegments.filter((segment) => /--draft\\b/i.test(segment)); const hasDraftCreate = draftCreateSegments.length > 0; const allDraftCreatesValid = hasDraftCreate && draftCreateSegments.every((segment) => { const title = extractArg(segment, 'title'); const body = extractArg(segment, 'body'); return title !== null && title !== '' && conventionalRe.test(title) && !wipRe.test(title) && body !== null && body !== ''; }); hasDraftCreate && allDraftCreatesValid"

  - description: "pr-lifecycle: flow-to-type mapping is a default, not absolute"
