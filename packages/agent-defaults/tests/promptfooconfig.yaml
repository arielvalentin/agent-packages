      - type: contains
        value: "#42"
      - type: contains
        value: "a=b"
      - type: javascript
        value: "/(previous|before|used to|was|were|instead|rather than|not .?a\\b|truncat)/i.test(output)"
      - type: javascript
        value: "!/(TRACE-101|parseHeader|src\\/header\\.ts|npm|\\b48\\b|unit tests|\\blint\\b|\\bCI\\b|checks passed|routine checks)/i.test(output)"
      - type: javascript
