      user_input: "Is `fix:   ` (a colon followed only by spaces, with no description text) a valid PR title under this skill's title format? Start your reply with exactly one word, Yes or No, then state the specific reason."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsEmptyDescription = /\\bdescription\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|whitespace|no\\s+description|only\\s+spaces|only\\s+whitespace)\\b/.test(stripped); startsNo && mentionsEmptyDescription"

  - description: "pr-lifecycle: title is unscoped by default"
