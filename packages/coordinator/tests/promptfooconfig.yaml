  - description: "pr-lifecycle: breaking changes use the optional ! marker"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "According to the Title format section, exactly how do I write a breaking-change PR title? Quote the format."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); const grammarRe = /(<type>|feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\(<scope>\\)|\\([^()\\s]+\\))?!:\\s+\\S/; grammarRe.test(l) && l.includes('break')"

  - description: "pr-lifecycle: validates title before create"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr create` to open a PR, must I validate the title against the Title format section? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "pr-lifecycle: validates title before update"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr edit --title` to update a PR's title, must I validate the new title against the Title format section? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "pr-lifecycle: validates title before ready"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr ready` to mark a PR ready for review, must I validate the title against the Title format section? Answer exactly one word: Yes or No."
    assert:
