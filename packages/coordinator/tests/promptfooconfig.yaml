        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsEmptyScope = /\\(\\)/.test(stripped) || (/\\bscope\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|no\\s+scope)\\b/.test(stripped)); startsNo && mentionsEmptyScope"

  - description: "pr-lifecycle: rejects a whitespace-only scope as invalid grammar"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Is `fix( ): correct the bug` (a scope made only of a single space) a valid PR title under this skill's title format? Start your reply with exactly one word, Yes or No, then state the specific reason."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsWhitespaceScope = /\\bscope\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|whitespace|no\\s+scope|only\\s+(a\\s+)?spaces?|only\\s+whitespace|not\\s+(a\\s+)?(valid|non-empty|non-whitespace)|invalid)\\b/.test(stripped); startsNo && mentionsWhitespaceScope"

  - description: "pr-lifecycle: rejects a whitespace-only description as invalid grammar"
    vars:
