description: "Coordinator package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  # --- tech-research ---
  - description: "tech-research: runs same-source queries sequentially"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "I have three related questions that all require searching GitHub. Should I launch three researchers in parallel? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^no[.!]?$/.test(l)"

  - description: "tech-research: allows parallel distinct backends"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Can I research GitHub, Azure documentation, and the public web at the same time? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "tech-research: requires evidence and one synthesis"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "What should each researcher return, and who performs the single synthesis?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('source') || l.includes('citation') || l.includes('url')) && l.includes('fact') && l.includes('coordinator') && (l.includes('single') || l.includes('once')) && l.includes('synthes') && !l.includes('each researcher synthes')"

  - description: "tech-research: never duplicates research for consensus"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Should I ask three models to research the same Azure documentation pages so I can build consensus? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^no[.!]?$/.test(l)"

  - description: "tech-research: routes short answers inline"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should a short factual answer with no durable artifact go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('inline') && !l.includes('system-architect') && !l.includes('se-technical-writer')"

  - description: "tech-research: routes architecture input"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should research for a design or architectural decision go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('system-architect') && !l.includes('se-technical-writer')"

  - description: "tech-research: routes technical reports"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should synthesized findings for a technical report go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('se-technical-writer')"

  - description: "tech-research: hands off durable synthesis without re-querying"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "How do I hand durable synthesized research to another agent, and should that agent repeat the covered backend queries?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('artifact_paths') && /(do not|don't|should not|must not|never|avoid|without|no need|not necessary|skip)/.test(l) && /(re-?query|repeat|redundant|duplicate)/.test(l) && (l.includes('covered') || l.includes('backend'))"

  # --- pr-lifecycle ---
  - description: "pr-lifecycle: draft PR create command is non-interactive — a conventional --title plus a --body in position (no prose fallback, no <type> placeholder exception), and a later gh pr edit --title/--body cannot launder a WIP/missing create title"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I am fixing a null-pointer crash in the login handler on this bugfix branch, and no draft PR exists yet. What exact `gh pr create` command do I run right now?"
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "gh pr create"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "const raw = output; const BT = String.fromCharCode(96); const DQ = String.fromCharCode(34); const SQ = String.fromCharCode(39); const SENT = String.fromCharCode(1); const normalized = raw.replace(/\\\\\\s*\\n\\s*/g, ' '); function ciIndexOf(text, needle, from) { const escaped = needle.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&').replace(/\\s+/g, '\\\\s+'); const re = new RegExp(escaped, 'i'); const rel = text.slice(from || 0).search(re); return rel === -1 ? -1 : rel + (from || 0); } function maskFlag(text, flag) { return text.replace(new RegExp('(--' + flag + '\\\\s*=?\\\\s*)' + BT + '([^' + BT + ']*)' + BT, 'gi'), function (m, p1, p2) { return p1 + SENT + p2 + SENT; }); } const masked = maskFlag(maskFlag(normalized, 'title'), 'body'); function extractCreateSegments(text) { const out = []; const anchor = 'gh pr create'; const ghRe = /\\bgh\\b/gi; let idx = ciIndexOf(text, anchor); while (idx !== -1) { const searchFrom = idx + anchor.length; const nextCreate = ciIndexOf(text, anchor, searchFrom); const nextBacktick = text.indexOf(BT, searchFrom); const nextNewline = text.indexOf('\\n', searchFrom); ghRe.lastIndex = searchFrom; const ghMatch = ghRe.exec(text); const nextGh = ghMatch ? ghMatch.index : -1; const stops = [nextCreate, nextBacktick, nextNewline, nextGh].filter((i) => i !== -1); const end = stops.length ? Math.min(...stops) : text.length; out.push(text.slice(idx, end)); idx = nextCreate; } return out; } const createSegments = extractCreateSegments(masked).map((seg) => seg.split(/\\s*(?:&&|;|\\|\\|)\\s*/)[0]); function extractArg(segment, flag) { const anchorRe = new RegExp('--' + flag + '\\\\s*=?\\\\s*', 'i'); const m = anchorRe.exec(segment); if (!m) return null; const rest = segment.slice(m.index + m[0].length); let val = ''; if (rest[0] === DQ) { const end = rest.indexOf(DQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SQ) { const end = rest.indexOf(SQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SENT) { const end = rest.indexOf(SENT, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else { const flagMatch = rest.match(/\\s+--[a-z]/i); const flagIdx = flagMatch ? flagMatch.index : -1; const nlIdx = rest.indexOf('\\n'); const stops = [flagIdx, nlIdx].filter((i) => i !== -1); const endIdx = stops.length ? Math.min(...stops) : rest.length; val = rest.slice(0, endIdx); } return val.trim(); } const conventionalRe = /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/; const wipRe = /^wip\\b/i; const draftCreateSegments = createSegments.filter((segment) => /--draft\\b/i.test(segment)); const hasDraftCreate = draftCreateSegments.length > 0; const allDraftCreatesValid = hasDraftCreate && draftCreateSegments.every((segment) => { const title = extractArg(segment, 'title'); const body = extractArg(segment, 'body'); return title !== null && title !== '' && conventionalRe.test(title) && !wipRe.test(title) && body !== null && body !== ''; }); hasDraftCreate && allDraftCreatesValid"

  - description: "pr-lifecycle: flow-to-type mapping is a default, not absolute"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I'm in a bugfix flow, but the very first change is documentation-only. Reply with exactly two lines and nothing else, in this exact format:\nOverridable: <Yes or No> (can the flow's default type mapping be overridden when the actual initial change is docs, test, chore, ci, perf, build, or revert work?)\nType: <the single Conventional Commits type token you would use for the draft PR title in this situation>"
    assert:
      - type: javascript
        value: "const BT = String.fromCharCode(96); const stripped = output.replace(new RegExp(BT, 'g'), ''); const overridableMatch = /overridable\\s*:\\s*(yes|no)\\b/i.exec(stripped); const typeMatch = /type\\s*:\\s*([a-z]+)\\b/i.exec(stripped); const isOverridable = !!overridableMatch && overridableMatch[1].toLowerCase() === 'yes'; const typeIsDocs = !!typeMatch && typeMatch[1].toLowerCase() === 'docs'; isOverridable && typeIsDocs"

  - description: "pr-lifecycle: rejects an empty scope as invalid grammar (explicit leading rejection)"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Is `fix(): correct the bug` a valid PR title under this skill's title format? Start your reply with exactly one word, Yes or No, then state the specific reason."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsEmptyScope = /\\(\\)/.test(stripped) || (/\\bscope\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|no\\s+scope)\\b/.test(stripped)); startsNo && mentionsEmptyScope"

  - description: "pr-lifecycle: rejects a whitespace-only scope as invalid grammar"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Is `fix( ): correct the bug` (a scope made only of a single space) a valid PR title under this skill's title format? Start your reply with exactly one word, Yes or No, then state the specific reason."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsWhitespaceScope = /\\bscope\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|whitespace|no\\s+scope|only\\s+(a\\s+)?spaces?|only\\s+whitespace|not\\s+(a\\s+)?(valid|non-empty|non-whitespace)|invalid)\\b/.test(stripped); startsNo && mentionsWhitespaceScope"

  - description: "pr-lifecycle: rejects a whitespace-only description as invalid grammar"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Is `fix:   ` (a colon followed only by spaces, with no description text) a valid PR title under this skill's title format? Start your reply with exactly one word, Yes or No, then state the specific reason."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); const startsNo = /^no\\b/.test(stripped); const mentionsEmptyDescription = /\\bdescription\\b/.test(stripped) && /\\b(empty|blank|missing|nothing|whitespace|no\\s+description|only\\s+spaces|only\\s+whitespace)\\b/.test(stripped); startsNo && mentionsEmptyDescription"

  - description: "pr-lifecycle: title is unscoped by default"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Under this skill's Title format, is a (scope) required in the PR title by default? Start your reply with exactly one word, Yes or No."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); /^no\\b/.test(stripped)"

  - description: "pr-lifecycle: scope is permitted only when material"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Under this skill's Title format, is the scoped form <type>(<scope>): <description> allowed only when the scope materially clarifies the change, rather than being usable at any time for any reason? Start your reply with exactly one word, Yes or No."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase().replace(/[*_#]/g, '').trim(); const BT = String.fromCharCode(96); const stripped = l.split(BT).join(''); /^yes\\b/.test(stripped)"

  - description: "pr-lifecycle: breaking changes use the optional ! marker"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "According to the Title format section, exactly how do I write a breaking-change PR title? Quote the format."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); const grammarRe = /(<type>|feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\(<scope>\\)|\\([^()\\s]+\\))?!:\\s+\\S/; grammarRe.test(l) && l.includes('break')"

  - description: "pr-lifecycle: validates title before create"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr create` to open a PR, must I validate the title against the Title format section? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "pr-lifecycle: validates title before update"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr edit --title` to update a PR's title, must I validate the new title against the Title format section? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "pr-lifecycle: validates title before ready"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "Before running `gh pr ready` to mark a PR ready for review, must I validate the title against the Title format section? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^yes[.!]?$/.test(l)"

  - description: "pr-lifecycle: finalization re-derives/corrects the title and explicitly rejects rename/convert-to-conventional framing"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "My PR is ready to finalize. Statement: finalization converts or renames the PR title into Conventional Commits format for the first time. Is that statement true or false? Start your reply with exactly one word, True or False, then explain what finalization actually does to the title."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); const stripped = l.replace(/[*_#]/g, '').split(String.fromCharCode(96)).join('').trim(); const leadingDecline = /^false\\b/.test(stripped); const describesCorrection = /\\b(re-derive[sd]?|rederive[sd]?|correct(?:s|ed|ion)?|refine[sd]?|refinement)\\b/.test(l); leadingDecline && describesCorrection"

  - description: "pr-lifecycle: skips early draft PR for research flows"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I am doing a research flow to investigate a performance issue. Should I open a PR?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('skip') || l.includes('no') || l.includes('not') || l.includes(\"don't\") || l.includes('unnecessary')"

  - description: "pr-lifecycle: monitors CI after push"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I just pushed commits to my PR branch. What should I do next?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('gh pr checks') || l.includes('gh pr create') || l.includes('ci') || l.includes('check') || l.includes('review') || l.includes('monitor')"

  # --- pr-review-protocol ---
  - description: "pr-review-protocol: waits for required CI before review"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "The pull request has a failing required check. Should I review it now?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('stop') || l.includes('wait') || l.includes('not proceed') || l.includes(\"don't review\") || l.includes('do not review')) && (l.includes('green') || l.includes('pass') || l.includes('required check'))"

  - description: "pr-review-protocol: establishes intent before reviewing code"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "What context should I gather before reviewing a pull request diff?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('description') || l.includes('issue') || l.includes('intent') || l.includes('acceptance') || l.includes('rationale')"

  - description: "pr-review-protocol: targets the repository and reuses context"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "How do I avoid reviewing the wrong repository or repeatedly fetching the same PR?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('--repo') || l.includes('owner/repo') || l.includes('repository')) && (l.includes('once') || l.includes('artifact') || l.includes('reuse') || l.includes('saved'))"

  - description: "pr-review-protocol: requires evidence and one synthesized review"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "Should I post several quick review comments based only on my opinions?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('evidence') || l.includes('documentation') || l.includes('spec') || l.includes('repository')) && (l.includes('one') || l.includes('single') || l.includes('synthes'))"

  - description: "adversarial-review: uses multiple independent model lineages"
    vars:
      skill_content: file://../.apm/skills/adversarial-review/SKILL.md
      user_input: "How does the adversarial review work? What models are used?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('gpt') || l.includes('claude') || l.includes('gemini') || l.includes('lineage') || l.includes('independent') || l.includes('parallel')"

  - description: "adversarial-review: panel members do not spawn nested reviews"
    vars:
      skill_content: file://../.apm/skills/adversarial-review/SKILL.md
      user_input: "My handoff says consensus_role: panel-member. Should I dispatch more reviewer agents?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('do not') || l.includes(\"don't\") || l.includes('no') || l.includes('not dispatch')) && (l.includes('direct') || l.includes('single') || l.includes('panel'))"

  # --- review-fix-loop ---
  - description: "review-fix-loop: escalates after max retries"
    vars:
      skill_content: file://../.apm/skills/review-fix-loop/SKILL.md
      user_input: "What happens if the review-fix loop keeps finding issues after many retries?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('escalat') || l.includes('stop') || l.includes('max') || l.includes('limit') || l.includes('abort') || l.includes('exhaust')"

  - description: "review-fix-loop: specialist reviews use consensus panel"
    vars:
      skill_content: file://../.apm/skills/review-fix-loop/SKILL.md
      user_input: "How should the reviewer be dispatched during a review-fix loop?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('consensus-panel') || l.includes('consensus panel') || l.includes('panel policy')"

  # --- acting-on-behalf ---
  - description: "acting-on-behalf: includes AI disclaimer in PR comments"
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: "I need to post a comment on a PR. What must I include?"
    assert:
      - type: icontains
        value: "disclaimer"
      - type: icontains
        value: "AI"

  - description: "acting-on-behalf: requires adversarial review before PR creation"
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: "What safety checks do I need before opening a PR with code changes?"
    assert:
      - type: icontains
        value: "adversarial"

  - description: "acting-on-behalf: pr-lifecycle-missing fallback requires a case-sensitive valid non-WIP --title plus --body on the same gh pr create --draft command (a bare create followed by a later gh pr edit --title/--body cannot launder it, and an uppercase FIX: title must fail)"
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: "The pr-lifecycle skill is unavailable and no draft PR exists yet for my bugfix branch. What exact `gh pr create` command do I run right now?"
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "--title"
      - type: icontains
        value: "--body"
      - type: javascript
        value: "const raw = output; const BT = String.fromCharCode(96); const DQ = String.fromCharCode(34); const SQ = String.fromCharCode(39); const SENT = String.fromCharCode(1); const normalized = raw.replace(/\\\\\\s*\\n\\s*/g, ' '); function ciIndexOf(text, needle, from) { const escaped = needle.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&').replace(/\\s+/g, '\\\\s+'); const re = new RegExp(escaped, 'i'); const rel = text.slice(from || 0).search(re); return rel === -1 ? -1 : rel + (from || 0); } function maskFlag(text, flag) { return text.replace(new RegExp('(--' + flag + '\\\\s*=?\\\\s*)' + BT + '([^' + BT + ']*)' + BT, 'gi'), function (m, p1, p2) { return p1 + SENT + p2 + SENT; }); } const masked = maskFlag(maskFlag(normalized, 'title'), 'body'); function extractCreateSegments(text) { const out = []; const anchor = 'gh pr create'; const ghRe = /\\bgh\\b/gi; let idx = ciIndexOf(text, anchor); while (idx !== -1) { const searchFrom = idx + anchor.length; const nextCreate = ciIndexOf(text, anchor, searchFrom); const nextBacktick = text.indexOf(BT, searchFrom); const nextNewline = text.indexOf('\\n', searchFrom); ghRe.lastIndex = searchFrom; const ghMatch = ghRe.exec(text); const nextGh = ghMatch ? ghMatch.index : -1; const stops = [nextCreate, nextBacktick, nextNewline, nextGh].filter((i) => i !== -1); const end = stops.length ? Math.min(...stops) : text.length; out.push(text.slice(idx, end)); idx = nextCreate; } return out; } const createSegments = extractCreateSegments(masked).map((seg) => seg.split(/\\s*(?:&&|;|\\|\\|)\\s*/)[0]); function extractArg(segment, flag) { const anchorRe = new RegExp('--' + flag + '\\\\s*=?\\\\s*', 'i'); const m = anchorRe.exec(segment); if (!m) return null; const rest = segment.slice(m.index + m[0].length); let val = ''; if (rest[0] === DQ) { const end = rest.indexOf(DQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SQ) { const end = rest.indexOf(SQ, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else if (rest[0] === SENT) { const end = rest.indexOf(SENT, 1); val = end === -1 ? rest.slice(1) : rest.slice(1, end); } else { const flagMatch = rest.match(/\\s+--[a-z]/i); const flagIdx = flagMatch ? flagMatch.index : -1; const nlIdx = rest.indexOf('\\n'); const stops = [flagIdx, nlIdx].filter((i) => i !== -1); const endIdx = stops.length ? Math.min(...stops) : rest.length; val = rest.slice(0, endIdx); } return val.trim(); } const conventionalRe = /^(feat|fix|docs|refactor|test|chore|ci|perf|build|revert)(\\([^()\\s]+\\))?!?:\\s+\\S/; const wipRe = /^wip\\b/i; const draftCreateSegments = createSegments.filter((segment) => /--draft\\b/i.test(segment)); const hasDraftCreate = draftCreateSegments.length > 0; const allDraftCreatesValid = hasDraftCreate && draftCreateSegments.every((segment) => { const title = extractArg(segment, 'title'); const body = extractArg(segment, 'body'); return title !== null && title !== '' && conventionalRe.test(title) && !wipRe.test(title) && body !== null && body !== ''; }); hasDraftCreate && allDraftCreatesValid"

  # --- consensus-panel ---
  - description: "consensus-panel: dispatches to multiple models in parallel"
    vars:
      skill_content: file://../.apm/skills/consensus-panel/SKILL.md
      user_input: "How does the consensus panel work?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('parallel') || l.includes('multiple') || l.includes('dispatch')) && (l.includes('consensus') || l.includes('verdict') || l.includes('synthesiz') || l.includes('unified'))"

  - description: "consensus-panel: never duplicates research for consensus"
    vars:
      skill_content: file://../.apm/skills/consensus-panel/SKILL.md
      user_input: "Should I send three agents to search the same GitHub repository for the same facts?"
    assert:
      - type: javascript
