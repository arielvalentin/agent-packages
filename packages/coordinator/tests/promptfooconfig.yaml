description: "Coordinator package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  # --- coordinator fast path ---
  - description: "coordinator: bounded code work stays direct"
    vars:
      skill_content: file://../.apm/agents/coordinator.agent.md
      user_input: "I need a one-line typo fix in one source file and one targeted test. Should you delegate the work? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, '').split(String.fromCharCode(96)).join(''); /^no[.!]?$/.test(l)"

  - description: "coordinator: mandatory security dispatch overrides five-call heuristic"
    vars:
      skill_content: file://../.apm/agents/coordinator.agent.md
      user_input: "A request explicitly asks to find exploitable vulnerabilities and is otherwise tiny. Choose exactly one routing token: SECURITY_REVIEW_FIRST or DIRECT_FIVE_CALL."
    assert:
      - type: javascript
        value: "const l = output.trim().toUpperCase().replace(/[*#]/g, '').split(String.fromCharCode(96)).join(''); l === 'SECURITY_REVIEW_FIRST'"

  - description: "review-fix-loop: mandatory adversarial exhaustion cannot warn"
    vars:
      skill_content: file://../.apm/skills/review-fix-loop/SKILL.md
