description: "Coordinator package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  # --- tech-research ---
  - description: "tech-research: runs same-source queries sequentially"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "I have three related questions that all require searching GitHub. Should I launch three researchers in parallel? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, ''); /^no[.!]?$/.test(l)"

  - description: "tech-research: allows parallel distinct backends"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Can I research GitHub, Azure documentation, and the public web at the same time? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, ''); /^yes[.!]?$/.test(l)"

  - description: "tech-research: requires evidence and one synthesis"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "What should each researcher return, and who performs the single synthesis?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('source') || l.includes('citation') || l.includes('url')) && l.includes('fact') && l.includes('coordinator') && (l.includes('single') || l.includes('once')) && l.includes('synthes') && !l.includes('each researcher synthes')"

  - description: "tech-research: never duplicates research for consensus"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Should I ask three models to research the same Azure documentation pages so I can build consensus? Answer exactly one word: Yes or No."
    assert:
      - type: javascript
        value: "const l = output.trim().toLowerCase().replace(/[*_#]/g, ''); /^no[.!]?$/.test(l)"

  - description: "tech-research: routes short answers inline"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should a short factual answer with no durable artifact go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('inline') && !l.includes('system-architect') && !l.includes('se-technical-writer')"

  - description: "tech-research: routes architecture input"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should research for a design or architectural decision go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('system-architect') && !l.includes('se-technical-writer')"

  - description: "tech-research: routes technical reports"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "Where should synthesized findings for a technical report go? Answer exactly with the destination."
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('se-technical-writer')"

  - description: "tech-research: hands off durable synthesis without re-querying"
    vars:
      skill_content: file://../.apm/skills/tech-research/SKILL.md
      user_input: "How do I hand durable synthesized research to another agent, and should that agent repeat the covered backend queries?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('artifact_paths') && /(do not|don't|should not|must not|never|avoid|without|no need|not necessary|skip)/.test(l) && /(re-?query|repeat|redundant|duplicate)/.test(l) && (l.includes('covered') || l.includes('backend'))"

  # --- pr-lifecycle ---
  - description: "pr-lifecycle: creates draft PR for new feature work"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I just started a new feature branch. What should I do about a PR?"
    assert:
      - type: icontains
        value: "--draft"
      - type: icontains
        value: "gh pr create"

  - description: "pr-lifecycle: skips WIP PR for research flows"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I am doing a research flow to investigate a performance issue. Should I open a PR?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('skip') || l.includes('no') || l.includes('not') || l.includes(\"don't\") || l.includes('unnecessary')"

  - description: "pr-lifecycle: monitors CI after push"
    vars:
      skill_content: file://../.apm/skills/pr-lifecycle/SKILL.md
      user_input: "I just pushed commits to my PR branch. What should I do next?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('gh pr checks') || l.includes('gh pr create') || l.includes('ci') || l.includes('check') || l.includes('review') || l.includes('monitor')"

  # --- pr-review-protocol ---
  - description: "pr-review-protocol: waits for required CI before review"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "The pull request has a failing required check. Should I review it now?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('stop') || l.includes('wait') || l.includes('not proceed') || l.includes(\"don't review\") || l.includes('do not review')) && (l.includes('green') || l.includes('pass') || l.includes('required check'))"

  - description: "pr-review-protocol: establishes intent before reviewing code"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "What context should I gather before reviewing a pull request diff?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('description') || l.includes('issue') || l.includes('intent') || l.includes('acceptance') || l.includes('rationale')"

  - description: "pr-review-protocol: targets the repository and reuses context"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "How do I avoid reviewing the wrong repository or repeatedly fetching the same PR?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('--repo') || l.includes('owner/repo') || l.includes('repository')) && (l.includes('once') || l.includes('artifact') || l.includes('reuse') || l.includes('saved'))"

  - description: "pr-review-protocol: requires evidence and one synthesized review"
    vars:
      skill_content: file://../.apm/skills/pr-review-protocol/SKILL.md
      user_input: "Should I post several quick review comments based only on my opinions?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('evidence') || l.includes('documentation') || l.includes('spec') || l.includes('repository')) && (l.includes('one') || l.includes('single') || l.includes('synthes'))"

  - description: "adversarial-review: uses multiple independent model lineages"
    vars:
      skill_content: file://../.apm/skills/adversarial-review/SKILL.md
      user_input: "How does the adversarial review work? What models are used?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('gpt') || l.includes('claude') || l.includes('gemini') || l.includes('lineage') || l.includes('independent') || l.includes('parallel')"

  - description: "adversarial-review: panel members do not spawn nested reviews"
    vars:
      skill_content: file://../.apm/skills/adversarial-review/SKILL.md
      user_input: "My handoff says consensus_role: panel-member. Should I dispatch more reviewer agents?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('do not') || l.includes(\"don't\") || l.includes('no') || l.includes('not dispatch')) && (l.includes('direct') || l.includes('single') || l.includes('panel'))"

  # --- review-fix-loop ---
  - description: "review-fix-loop: escalates after max retries"
    vars:
      skill_content: file://../.apm/skills/review-fix-loop/SKILL.md
      user_input: "What happens if the review-fix loop keeps finding issues after many retries?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('escalat') || l.includes('stop') || l.includes('max') || l.includes('limit') || l.includes('abort') || l.includes('exhaust')"

  - description: "review-fix-loop: specialist reviews use consensus panel"
    vars:
      skill_content: file://../.apm/skills/review-fix-loop/SKILL.md
      user_input: "How should the reviewer be dispatched during a review-fix loop?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('consensus-panel') || l.includes('consensus panel') || l.includes('panel policy')"

  # --- acting-on-behalf ---
  - description: "acting-on-behalf: includes AI disclaimer in PR comments"
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: "I need to post a comment on a PR. What must I include?"
    assert:
      - type: icontains
        value: "disclaimer"
      - type: icontains
        value: "AI"

  - description: "acting-on-behalf: requires adversarial review before PR creation"
    vars:
      skill_content: file://../.apm/skills/acting-on-behalf/SKILL.md
      user_input: "What safety checks do I need before opening a PR with code changes?"
    assert:
      - type: icontains
        value: "adversarial"

  # --- consensus-panel ---
  - description: "consensus-panel: dispatches to multiple models in parallel"
    vars:
      skill_content: file://../.apm/skills/consensus-panel/SKILL.md
      user_input: "How does the consensus panel work?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('parallel') || l.includes('multiple') || l.includes('dispatch')) && (l.includes('consensus') || l.includes('verdict') || l.includes('synthesiz') || l.includes('unified'))"

  - description: "consensus-panel: never duplicates research for consensus"
    vars:
      skill_content: file://../.apm/skills/consensus-panel/SKILL.md
      user_input: "Should I send three agents to search the same GitHub repository for the same facts?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); (l.includes('not') || l.includes('never') || l.includes('do not') || l.includes(\"don't\")) && (l.includes('one') || l.includes('single') || l.includes('duplicate') || l.includes('identical'))"

  # --- stage-pr ---
  - description: "stage-pr: creates a preview environment"
    vars:
      skill_content: file://../.apm/skills/stage-pr/SKILL.md
      user_input: "I want to preview this PR in a running environment. How?"
    assert:
      - type: javascript
        value: "const l = output.toLowerCase(); l.includes('codespace') || l.includes('preview') || l.includes('environment') || l.includes('dev server') || l.includes('localhost')"
