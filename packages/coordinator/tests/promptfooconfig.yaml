        value: "/^security-review[.!]?$/i.test(output.trim().replace(/[*_`]/g, ''))"

  - description: "coordinator: safeguard policy changes require adversarial review"
    vars:
      skill_content: file://../.apm/agents/coordinator.agent.md
      user_input: "A bounded change modifies a human-interaction safeguard SKILL.md. Choose exactly one routing token: `DIRECT_HIGH_RISK_ADVERSARIAL` or `ROUTINE_OPTIONAL`."
