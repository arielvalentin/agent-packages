description: "Coordinator package behavioral tests"

providers:
  - id: ollama:llama3.2:3b
    config:
      temperature: 0
    label: skill-under-test

prompts:
  - "{{skill_content}}\n\nYou are an AI agent following the skill instructions above. Respond to the user's request.\n\nUser: {{user_input}}"

tests:
  - description: "human-interaction: coordinator fallback fails closed"
    vars:
      skill_content: file://../.apm/agents/coordinator.agent.md
      user_input: "The human-interaction-safeguard skill failed to load and a public GitHub comment's actor type is unknown. Must the coordinator treat it as human and stop implementation, reply drafting/posting, and thread resolution? Reply with exactly `Yes`."
    assert:
      - type: javascript
        value: "/^yes[.!]?$/i.test(output.trim())"

  - description: "acting-on-behalf: coordinator fallback defers attribution policy"
    vars:
      skill_content: file://../.apm/agents/coordinator.agent.md
      user_input: "In the PR review fallback, which skill decides what attribution is included? Reply with exactly `acting-on-behalf`."
    assert:
      - type: javascript
        value: "/^acting-on-behalf[.!]?$/i.test(output.trim().replace(/[*_`]/g, ''))"
