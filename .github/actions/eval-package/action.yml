name: "Run Copilot Evals"
description: "Installs the pinned project toolchain and runs a native Vally evaluation suite"

inputs:
  package:
    description: "Package name (directory under packages/)"
    required: true
  suite:
    description: "Run the smoke suite or the full package suite"
    required: false
    default: "smoke"
  copilot-token:
    description: "Copilot-compatible token used only for the evaluation step"
    required: false
  node-version:
    description: "Node.js version"
    required: false
    default: "26"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-node-${{ inputs.node-version }}-

    - name: Install repository npm version
      shell: bash
      run: npm install --global "npm@$(node -p "require('./package.json').devEngines.packageManager.version")"

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Record evaluation runtime
      shell: bash
      run: |
        set -euo pipefail
        uname -sm
        node --version
        npm --version
        npx --no-install vally --version
        node -e "const fs=require('node:fs');const path=require('node:path');const manifest=path.resolve(path.dirname(require.resolve('@github/copilot-sdk')),'../../package.json');console.log(JSON.parse(fs.readFileSync(manifest,'utf8')).version)"

    - name: Run native evaluation
      shell: bash
      env:
        VALLY_RESULTS_DIR: ${{ runner.temp }}/vally-results
        GH_TOKEN: ${{ inputs.copilot-token }}
      run: |
        set -euo pipefail
        node script/run-evals.js "${{ inputs.package }}" "${{ inputs.suite }}"

    - name: Upload Vally results
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: eval-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/vally-results
        if-no-files-found: warn
        retention-days: 7
