name: "Run promptfoo eval"
description: "Sets up Ollama (pinned + SHA256 verified), pulls the model, installs deps, and runs promptfoo eval for a package"

inputs:
  package:
    description: "Package name (directory under packages/)"
    required: true
  suite:
    description: "Run the smoke suite or the full package suite"
    required: false
    default: "smoke"
  model:
    description: "Ollama model to use"
    required: false
    default: "llama3.2:3b"
  node-version:
    description: "Node.js version"
    required: false
    default: "26"
  ollama-version:
    description: "Pinned Ollama release version"
    required: false
    default: "0.32.5"
  ollama-sha256:
    description: "SHA256 checksum of ollama-linux-amd64.tar.zst"
    required: false
    default: "f7d6bdbcf71b83aa8670c4e7dc4b6936c0952fcf8b114eaf6a11cbadb9684214"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Cache Ollama binary
      id: cache-ollama
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /usr/local/bin/ollama
          /usr/local/lib/ollama
        key: ollama-bin-${{ inputs.ollama-version }}

    - name: Install Ollama (pinned + verified)
      if: steps.cache-ollama.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        TARBALL="ollama-linux-amd64.tar.zst"
        URL="https://github.com/ollama/ollama/releases/download/v${{ inputs.ollama-version }}/${TARBALL}"

        echo "Downloading Ollama v${{ inputs.ollama-version }}..."
        curl -fSL -o "${TARBALL}" "${URL}"

        echo "Verifying SHA256 checksum..."
        echo "${{ inputs.ollama-sha256 }}  ${TARBALL}" | sha256sum -c -

        echo "Extracting..."
        tar --use-compress-program=unzstd -xf "${TARBALL}"
        sudo mv bin/ollama /usr/local/bin/ollama
        sudo mkdir -p /usr/local/lib/ollama
        sudo mv lib/ollama/* /usr/local/lib/ollama/
        rm -rf "${TARBALL}" bin/ lib/

        echo "✅ Ollama v${{ inputs.ollama-version }} installed and verified"

    - name: Cache Ollama model
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/share/ollama/.ollama
        key: ollama-model-${{ inputs.model }}-v1

    - name: Start Ollama and pull model
      shell: bash
      run: |
        ollama serve &
        sleep 2
        ollama pull ${{ inputs.model }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Record eval runtime
      shell: bash
      run: |
        uname -sm
        printf 'Logical CPUs: '
        getconf _NPROCESSORS_ONLN
        node --version
        npx --no-install promptfoo --version
        ollama --version
        curl --fail --silent --show-error http://localhost:11434/api/tags

    - name: Run evals
      shell: bash
      run: |
        suite="${{ inputs.suite }}"
        case "$suite" in
          smoke) eval_filter=(--filter-metadata suite=smoke) ;;
          full) eval_filter=() ;;
          *)
            echo "::error::Unknown eval suite '$suite'; expected smoke or full."
            exit 2
            ;;
        esac

        # GitHub invokes this shell with -e, which would abort the step on a
        # failing eval before the summary below can run. Take the exit code
        # ourselves instead.
        set +e
        set -uo pipefail
        npx promptfoo eval \
          --config packages/${{ inputs.package }}/tests/promptfooconfig.yaml \
          "${eval_filter[@]}" \
          --no-cache \
          --output "$RUNNER_TEMP/eval.json"
        status=$?
        if [[ ! -s "$RUNNER_TEMP/eval.json" ]]; then
          echo "::error::Promptfoo did not produce eval results; refusing to report success."
          status=1
        else
          node script/validate-promptfoo-eval.js "$RUNNER_TEMP/eval.json" "$suite"
          summary_status=$?
          if [[ $summary_status -ne 0 ]]; then
            status=1
          fi
        fi
        exit $status

    - name: Upload eval results
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: eval-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/eval.json
        if-no-files-found: warn
        retention-days: 7
