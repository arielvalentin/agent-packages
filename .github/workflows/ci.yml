name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install APM
        run: curl -sSL https://aka.ms/apm-unix | sh

      - name: Validate primitives (frontmatter + structure)
        run: |
          for pkg in packages/*/; do
            echo "=== Validating $pkg ==="
            if [[ "$pkg" == "packages/agent-defaults/" ]]; then
              # APM compile validates agents/instructions, not skills-only packages.
              bash script/check-agent-defaults.sh || exit 1
            else
              (cd "$pkg" && apm compile --validate --local-only) || exit 1
            fi
          done

      - name: Audit (hidden Unicode + drift)
        run: |
          for pkg in packages/*/; do
            echo "=== Auditing $pkg ==="
            for primitive in "$pkg".apm/skills/*/SKILL.md "$pkg".apm/agents/*.agent.md; do
              [[ -f "$primitive" ]] || continue
              apm audit --file "$primitive" || exit 1
            done
            (cd "$pkg" && apm audit) || exit 1
          done

      - name: Cross-reference checks
        run: |
          chmod +x script/check-cross-references.sh
          ./script/check-cross-references.sh

      - name: Consensus panel contract checks
        run: |
          chmod +x script/check-consensus-contract.sh
          ./script/check-consensus-contract.sh

      - name: Human interaction safety contract checks
        run: |
          chmod +x script/check-human-interaction-contract.sh
          ./script/check-human-interaction-contract.sh

      - name: Agent defaults and release compatibility checks
        run: bash script/check-agent-defaults.sh

  release-please-config:
    name: Validate release-please config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release-please configuration
        run: ./script/validate-release-please
