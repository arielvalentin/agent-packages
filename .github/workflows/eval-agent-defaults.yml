name: "Eval: agent-defaults"

on:
  push:
    branches: [main]
    paths:
      - "packages/agent-defaults/**"
      - "package.json"
      - "package-lock.json"
      - "script/run-promptfoo-smoke.sh"
      - "script/validate-promptfoo-eval.js"
      - ".github/workflows/eval-agent-defaults.yml"
      - ".github/actions/eval-package/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/agent-defaults/**"
      - "package.json"
      - "package-lock.json"
      - "script/run-promptfoo-smoke.sh"
      - "script/validate-promptfoo-eval.js"
      - ".github/workflows/eval-agent-defaults.yml"
      - ".github/actions/eval-package/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Run the smoke suite or the full package suite"
        required: true
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

jobs:
  eval:
    name: agent-defaults
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/eval-package
        with:
          package: agent-defaults
          suite: ${{ inputs.suite || 'smoke' }}
