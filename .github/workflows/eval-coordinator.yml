name: "Eval: coordinator"

on:
  push:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - "script/run-evals.js"
      - "script/validate-native-evals.js"
      - "script/validate-native-evals.test.js"
      - "script/native-eval-graders.mjs"
      - "script/native-eval-graders.test.js"
      - "script/vally-output.js"
      - "script/vally-output.test.js"
      - "docs/evaluations-migration-map.json"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - "script/run-evals.js"
      - "script/validate-native-evals.js"
      - "script/validate-native-evals.test.js"
      - "script/native-eval-graders.mjs"
      - "script/native-eval-graders.test.js"
      - "script/vally-output.js"
      - "script/vally-output.test.js"
      - "docs/evaluations-migration-map.json"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Run the smoke suite or the full package suite"
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  eval:
    name: coordinator
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'full' && 300 || 120 }}
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/eval-package
        with:
          package: coordinator
          suite: ${{ inputs.suite || 'smoke' }}
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
