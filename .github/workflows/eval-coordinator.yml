name: "Eval: coordinator"

on:
  push:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - "script/npm-ci.sh"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - "script/npm-ci.sh"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"

permissions:
  contents: read

jobs:
  eval-shard:
    name: coordinator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            filter-range: "0:77"
          - shard: 2/4
            filter-range: "77:117"
          - shard: 3/4
            filter-range: "117:178"
          - shard: 4/4
            filter-range: "178:"
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/eval-package
        with:
          package: coordinator
          filter-range: ${{ matrix.filter-range }}

  eval:
    name: coordinator
    if: ${{ always() }}
    needs: eval-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require successful coordinator shards
        env:
          SHARD_RESULT: ${{ needs.eval-shard.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "One or more coordinator evaluation shards failed."
            exit 1
          fi
