name: "Eval: coordinator"

on:
  push:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/coordinator/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/eval-coordinator.yml"
      - ".github/actions/eval-package/**"

permissions:
  contents: read

jobs:
  eval:
    name: coordinator
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/eval-package
        with:
          package: coordinator
